name: Build and database check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fusion-music-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fusion_music
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fusion_music"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusion_music
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint application
        run: npm run lint
      - name: Test Twitch chat command parser
        run: npm run test:chat
      - name: Check background worker syntax
        run: |
          node --check scripts/chat-worker.mjs
          node --check scripts/start.mjs
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Verify migrations are repeatable
        run: npm run db:migrate
      - name: Test database queue integrity
        run: npm run db:smoke
      - name: Build application
        run: npm run build
