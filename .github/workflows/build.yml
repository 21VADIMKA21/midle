name: Build and database check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fusion-music-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fusion_music
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fusion_music"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusion_music
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund
      - name: Save npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm install --package-lock-only --no-audit --no-fund
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi
      - name: Verify reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Lint application
        run: npm run lint
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Verify migrations are repeatable
        run: npm run db:migrate
      - name: Test database queue integrity
        run: npm run db:smoke
      - name: Build application
        run: npm run build
